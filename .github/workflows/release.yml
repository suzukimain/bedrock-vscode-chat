name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive release version from tag
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"

      - name: Sync package version to tag
        shell: bash
        run: |
          set -euo pipefail
          npm version "${RELEASE_VERSION}" --no-git-tag-version

      - run: npm ci
      - run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package -o extension.vsix

      - name: Rename VSIX to include version
        shell: bash
        run: |
          set -euo pipefail
          mv extension.vsix "bedrock-vscode-chat-${RELEASE_VERSION}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: bedrock-vscode-chat-${{ env.RELEASE_VERSION }}.vsix

  release:
    runs-on: ubuntu-latest
    needs: [package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VSIX_FILE=$(ls ./*.vsix | head -n 1)
          gh release create "${{ github.ref_name }}" "$VSIX_FILE" \
            --title "Bedrock VS Code Chat ${{ github.ref_name }}" \
            --notes "Automated release for ${{ github.ref_name }}.\n\nThis release includes the packaged VSIX artifact built from the tagged commit."